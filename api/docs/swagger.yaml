basePath: /api/v1
definitions:
  bookingtable_internal_httputil.ErrorResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  bookingtable_internal_httputil.ListResponse-internal_reservation_MyReservationResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/internal_reservation.MyReservationResponse'
        type: array
      total:
        type: integer
    type: object
  bookingtable_internal_httputil.ListResponse-internal_reservation_OwnerReservationResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/internal_reservation.OwnerReservationResponse'
        type: array
      total:
        type: integer
    type: object
  bookingtable_internal_httputil.ListResponse-internal_restaurant_RestaurantResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/internal_restaurant.RestaurantResponse'
        type: array
      total:
        type: integer
    type: object
  bookingtable_internal_httputil.ListResponse-internal_review_ReviewResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/internal_review.ReviewResponse'
        type: array
      total:
        type: integer
    type: object
  internal_auth.Credential:
    properties:
      accessToken:
        type: string
      bearerType:
        type: string
      expiresAt:
        type: string
      refreshToken:
        type: string
    type: object
  internal_auth.ExchangeRequest:
    properties:
      ticket:
        example: pQx7...base64url...
        type: string
    required:
    - ticket
    type: object
  internal_auth.LogoutRequest:
    properties:
      refreshToken:
        example: eyJhbGci...
        type: string
    required:
    - refreshToken
    type: object
  internal_auth.RefreshTokenRequest:
    properties:
      refreshToken:
        example: eyJhbGci...
        type: string
    required:
    - refreshToken
    type: object
  internal_reservation.CreateReservationResponse:
    properties:
      id:
        type: integer
    type: object
  internal_reservation.MyReservationResponse:
    properties:
      createdAt:
        type: string
      endAt:
        type: string
      guests:
        type: integer
      id:
        type: integer
      restaurant:
        $ref: '#/definitions/internal_reservation.RestaurantRef'
      startAt:
        type: string
      status:
        type: string
    type: object
  internal_reservation.OwnerReservationResponse:
    properties:
      createdAt:
        type: string
      customer:
        $ref: '#/definitions/internal_reservation.PersonRef'
      endAt:
        type: string
      guests:
        type: integer
      id:
        type: integer
      startAt:
        type: string
      status:
        type: string
    type: object
  internal_reservation.PersonRef:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  internal_reservation.RestaurantRef:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  internal_reservation.SaveReservationRequest:
    properties:
      endAt:
        type: string
      guests:
        maximum: 2147483647
        minimum: 1
        type: integer
      startAt:
        type: string
    required:
    - endAt
    - guests
    - startAt
    type: object
  internal_restaurant.CreateRestaurantResponse:
    properties:
      id:
        type: integer
    type: object
  internal_restaurant.MyReviewResponse:
    properties:
      comment:
        type: string
      id:
        type: integer
      rating:
        type: integer
    type: object
  internal_restaurant.OpeningHourRequest:
    properties:
      close:
        type: string
      open:
        type: string
      weekday:
        maximum: 6
        minimum: 0
        type: integer
    required:
    - close
    - open
    - weekday
    type: object
  internal_restaurant.OpeningHourResponse:
    properties:
      close:
        type: string
      open:
        type: string
      weekday:
        type: integer
    type: object
  internal_restaurant.PersonResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  internal_restaurant.RatingResponse:
    properties:
      average:
        type: number
      total:
        type: integer
    type: object
  internal_restaurant.RestaurantDetailResponse:
    properties:
      address:
        type: string
      cancellationLeadMinutes:
        type: integer
      description:
        type: string
      id:
        type: integer
      imageUrl:
        type: string
      isOwner:
        type: boolean
      myReview:
        $ref: '#/definitions/internal_restaurant.MyReviewResponse'
      name:
        type: string
      openingHours:
        items:
          $ref: '#/definitions/internal_restaurant.OpeningHourResponse'
        type: array
      owner:
        $ref: '#/definitions/internal_restaurant.PersonResponse'
      rating:
        $ref: '#/definitions/internal_restaurant.RatingResponse'
      seatingCapacity:
        type: integer
    type: object
  internal_restaurant.RestaurantResponse:
    properties:
      address:
        type: string
      cancellationLeadMinutes:
        type: integer
      description:
        type: string
      id:
        type: integer
      imageUrl:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/internal_restaurant.PersonResponse'
      rating:
        $ref: '#/definitions/internal_restaurant.RatingResponse'
      seatingCapacity:
        type: integer
    type: object
  internal_restaurant.SaveRestaurantRequest:
    properties:
      address:
        type: string
      cancellationLeadMinutes:
        maximum: 2147483647
        minimum: 30
        type: integer
      description:
        type: string
      name:
        maxLength: 255
        type: string
      openingHours:
        items:
          $ref: '#/definitions/internal_restaurant.OpeningHourRequest'
        minItems: 1
        type: array
      seatingCapacity:
        maximum: 2147483647
        minimum: 1
        type: integer
    required:
    - address
    - cancellationLeadMinutes
    - name
    - openingHours
    - seatingCapacity
    type: object
  internal_review.CreateReviewResponse:
    properties:
      id:
        type: integer
    type: object
  internal_review.PersonRef:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  internal_review.ReviewResponse:
    properties:
      comment:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      rating:
        type: integer
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/internal_review.PersonRef'
    type: object
  internal_review.SaveReviewRequest:
    properties:
      comment:
        type: string
      rating:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - comment
    - rating
    type: object
  internal_user.UpdateUserRequest:
    properties:
      bio:
        example: Home cook who loves spicy food.
        type: string
      imageUrl:
        example: https://images.example.com/avatar.jpg
        type: string
    type: object
  internal_user.UserResponse:
    properties:
      bio:
        example: Home cook who loves spicy food.
        type: string
      email:
        example: somchai@pea.co.th
        type: string
      id:
        example: 3f0c1a7e-2b19-4c5e-9f3a
        type: string
      imageUrl:
        example: https://images.example.com/avatar.jpg
        type: string
      name:
        example: สมชาย ใจดี
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API สำหรับระบบจองโต๊ะและรีวิวร้านอาหาร
  title: BookingTable API
  version: "1.0"
paths:
  /auth/callback:
    get:
      description: Keycloak redirect มาที่นี่เองอัตโนมัติ ไม่ใช่สิ่งที่ frontend เรียกตรงๆ
      parameters:
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      - description: State ที่ตรงกับตอน /auth/login
        in: query
        name: state
        required: true
        type: string
      responses:
        "302":
          description: Redirect กลับ frontend พร้อม ticket
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
      summary: รับ callback จาก Keycloak
      tags:
      - auth
  /auth/exchange:
    post:
      consumes:
      - application/json
      description: Frontend เรียกผ่าน axios หลังถูก redirect กลับมาพร้อม ticket
      parameters:
      - description: ticket
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ExchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.Credential'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
      summary: แลก ticket เป็น credential จริง
      tags:
      - auth
  /auth/login:
    get:
      description: Redirect ไปหน้า login ของ Keycloak
      responses:
        "302":
          description: Redirect ไป Keycloak
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
      summary: เริ่ม login ผ่าน Keycloak
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke refresh token ที่ Keycloak จริง
      parameters:
      - description: refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LogoutRequest'
      responses:
        "204":
          description: Logout สำเร็จ
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ออกจากระบบ
      tags:
      - auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: แลก refresh token เดิมเป็น credential ชุดใหม่จาก Keycloak
      parameters:
      - description: refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.Credential'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
      summary: ขอ access token ใหม่ด้วย refresh token
      tags:
      - auth
  /reservations:
    get:
      description: ทุกสถานะ เรียงเวลาเริ่มใหม่ไปเก่า แสดงชื่อร้านแม้ร้านถูกลบแล้ว
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ListResponse-internal_reservation_MyReservationResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: การจองของฉัน
      tags:
      - reservations
  /reservations/{id}:
    put:
      consumes:
      - application/json
      description: เฉพาะผู้จอง ตรวจ lead time จากเวลาเริ่มเดิม แล้วตรวจกฎการจองซ้ำ
        โดยไม่นับที่นั่งเดิมของตัวเอง
      parameters:
      - description: Reservation ID
        in: path
        name: id
        required: true
        type: integer
      - description: Reservation data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_reservation.SaveReservationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_reservation.MyReservationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: แก้ไขการจอง
      tags:
      - reservations
  /reservations/{id}/cancel:
    post:
      description: เฉพาะผู้จอง ต้องก่อนเวลาเริ่มอย่างน้อยเท่า lead time ของร้าน การจองที่ยกเลิกแล้วไม่นับในความจุ
      parameters:
      - description: Reservation ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ยกเลิกการจอง
      tags:
      - reservations
  /restaurants:
    get:
      description: ค้นหาตามชื่อ เรียงตามคะแนนเฉลี่ยหรือจำนวนรีวิว กรองเฉพาะร้านของตัวเอง
        และแบ่งหน้า
      parameters:
      - description: Search by name
        in: query
        name: name
        type: string
      - description: 'rating or reviews (default: newest first)'
        in: query
        name: sort
        type: string
      - description: Only my restaurants
        in: query
        name: mine
        type: boolean
      - description: Page (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 12, max 100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ListResponse-internal_restaurant_RestaurantResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: รายการร้านอาหาร
      tags:
      - restaurants
    post:
      consumes:
      - application/json
      description: ผู้ใช้ที่ยืนยันตัวตนแล้วจะเป็นเจ้าของร้าน รูปร้านตั้งผ่าน endpoint
        อัปโหลดเท่านั้น
      parameters:
      - description: Restaurant data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_restaurant.SaveRestaurantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_restaurant.CreateRestaurantResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: สร้างร้านอาหาร
      tags:
      - restaurants
  /restaurants/{id}:
    delete:
      description: เฉพาะเจ้าของร้าน เป็น soft delete
      parameters:
      - description: Restaurant ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ลบร้านอาหาร
      tags:
      - restaurants
    get:
      parameters:
      - description: Restaurant ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_restaurant.RestaurantDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ดูรายละเอียดร้านอาหาร
      tags:
      - restaurants
    put:
      consumes:
      - application/json
      description: เฉพาะเจ้าของร้าน แทนที่รายละเอียดและเวลาเปิดทั้งชุด ไม่แตะรูปร้าน
      parameters:
      - description: Restaurant ID
        in: path
        name: id
        required: true
        type: integer
      - description: Restaurant data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_restaurant.SaveRestaurantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_restaurant.RestaurantDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: แทนที่ข้อมูลร้านอาหารทั้งก้อน
      tags:
      - restaurants
  /restaurants/{id}/image:
    delete:
      parameters:
      - description: Restaurant ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: ลบรูปร้าน
      tags:
      - restaurants
    post:
      consumes:
      - multipart/form-data
      description: เฉพาะเจ้าของร้าน multipart ฟิลด์ file รับ JPEG, PNG, WebP ไม่เกิน
        2 MB ตรวจชนิดจากเนื้อไฟล์ และแทนที่รูปเดิม
      parameters:
      - description: Restaurant ID
        in: path
        name: id
        required: true
        type: integer
      - description: Picture (JPEG, PNG or WebP, at most 2 MB)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_restaurant.RestaurantDetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
      security:
      - BearerAuth: []
      summary: อัปโหลดรูปร้าน
      tags:
      - restaurants
  /restaurants/{id}/reservations:
    get:
      description: อ่านอย่างเดียว เฉพาะเจ้าของร้าน แสดงชื่อลูกค้าแต่ไม่แสดงอีเมล กรองตามสถานะได้
      parameters:
      - description: Restaurant ID
        in: path
        name: id
        required: true
        type: integer
      - description: 'confirmed or cancelled (default: all)'
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ListResponse-internal_reservation_OwnerReservationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/bookingtable_internal_httputil.ErrorResponse'
        "404":
