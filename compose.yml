services:
  postgres:
    image: postgres:17
    container_name: bookingtable-all-in-one-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ตั้งค่า POSTGRES_PASSWORD ใน .env (คัดลอกจาก .env.example)}
      POSTGRES_DB: bookingtable
    ports:
      - "5532:5432"
    volumes:
      - bookingtable-all-in-one-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8.10-alpine
    container_name: bookingtable-all-in-one-redis
    restart: always
    ports:
      - "6479:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: bookingtable-all-in-one-keycloak
    restart: always
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?ตั้งค่า KC_ADMIN_PASSWORD ใน .env}
      # ใช้แทนค่า ${KEYCLOAK_CLIENT_SECRET} ใน keycloak/import/pea-realm.json ตอน --import-realm
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?ตั้งค่า KEYCLOAK_CLIENT_SECRET ใน .env}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      # เก็บข้อมูลของ embedded database (dev-file) ไว้
      - bookingtable-all-in-one-keycloak-data:/opt/keycloak/data
      # snapshot ของ realm/client/client scopes/users สำหรับ --import-realm
      - ./keycloak/import:/opt/keycloak/data/import:ro

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: bookingtable-all-in-one-api
    restart: always
    depends_on:
      - postgres
      - redis
      - keycloak
    environment:
      APP_ENV: development
      APP_PORT: 8080
      APP_NAME: bookingtable
      LOG_LEVEL: DEBUG
      LOG_FORMAT: json
      # Database (เชื่อมต่อผ่านชื่อ service ในเครือข่าย compose แทน localhost)
      # POSTGRES_PASSWORD ต้องใช้อักขระที่ปลอดภัยใน URL เพราะถูกแทรกใน DSN นี้
      POSTGRES_DSN: postgres://postgres:${POSTGRES_PASSWORD:?ตั้งค่า POSTGRES_PASSWORD ใน .env}@postgres:5432/bookingtable?sslmode=disable
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Keycloak: ใช้ host:port เดียวกับที่ browser เปิด (keycloak.localhost:8180) ทั้งสองฝั่ง
      # เพื่อให้ URL ที่ API ส่ง browser ไป login และ issuer ใน token ตรงกัน
      # (browser resolve *.localhost เป็น loopback เอง; container ใช้ extra_hosts ด้านล่าง)
      KEYCLOAK_BASE_URL: http://keycloak.localhost:8180
      KEYCLOAK_REALM: pea
      KEYCLOAK_CLIENT_ID: bookingtable
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?ตั้งค่า KEYCLOAK_CLIENT_SECRET ใน .env}
      KEYCLOAK_REDIRECT_URL: http://localhost:8080/api/v1/auth/callback
      FRONTEND_URL: http://localhost:3000
    extra_hosts:
      # ชี้ keycloak.localhost ไปที่ host ของ Docker เพื่อเข้าพอร์ต 8180 ที่ publish ไว้
      - "keycloak.localhost:host-gateway"
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: bookingtable-all-in-one-web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: development
      # ค่านี้ถูก inline ลงใน client bundle จึงต้องเป็น URL ที่ browser บนเครื่อง host
      # เรียกถึงได้ ไม่ใช่ http://api:8080 ซึ่งใช้ได้เฉพาะภายในเครือข่าย compose
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      # ต้องเป็น 3000 เพราะ api ใช้ FRONTEND_URL redirect browser กลับมาที่พอร์ตนี้
      - "3000:3000"
    volumes:
      # bind mount source code เพื่อให้ hot reload ทำงาน
      - ./web:/app
      # anonymous volume กัน artifact ที่ build ใน container ถูก bind mount ทับ
      - /app/node_modules
      - /app/.next

volumes:
  bookingtable-all-in-one-pgdata:
  bookingtable-all-in-one-keycloak-data:
